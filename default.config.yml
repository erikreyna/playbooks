# configures the dock via dockutil. (boolean)
configure_dock: true

# https://github.com/geerlingguy/ansible-collection-mac/blob/master/roles/dock/README.md
dockitems_remove:
  - "App Store"
  - "Image Playground"
  - "iPhone Mirroring"
  - "Microsoft Excel"
  - "Microsoft Outlook"
  - "Microsoft PowerPoint"
  - "Microsoft Word"
  - "System Settings"
  - Calendar
  - Contacts
  - FaceTime
  - Freeform
  - Launchpad
  - Mail
  - Maps
  - Messages
  - Music
  - News
  - Notes
  - Numbers
  - Pages
  - Photos
  - Podcasts
  - Reminders
  - TV

dockutil_install: true

# fill out with your apple id email
mas_signin_dialog: yes
mas_email: ""

# https://github.com/geerlingguy/ansible-collection-mac/blob/master/roles/mas/README.md
mas_installed_apps:
  - { id: 497799835, name: "Xcode (14.2)" }
  - { id: 1569813296, name: "1Password for Safari  (2.7.0)" }

mas_uninstalled_apps:
  - { id: 408981434, name: "iMovie" }
  - { id: 409183694, name: "Keynote" }
  - { id: 682658836, name: "GarageBand" }

mas_upgrade_all_apps: true

# handy workaround for managing permissions for brew
should_be_root: "{{ true if ansible_pkg_mgr != 'brew' else false }}"

homebrew_upgrade_all_packages: true

homebrew_cask_appdir: /Applications

homebrew_installed_packages:
  - act
  - awscli
  - awslogs
  - bat
  - cantino/mcfly/mcfly
  - cfn-lint
  - cleanmymac
  - git
  - gh
  - jq
  - mas
  - openssl
  - python
  - pipx
  - wget

homebrew_taps:
  - homebrew/bundle
  - homebrew/services
  - cantino/mcfly

homebrew_cask_apps:
  - 1password
  - ableton-live-standard
  - adobe-creative-cloud
  - alfred
  - caffeine
  - discord
  - docker
  - firefox
  - gas-mask
  - gifox
  - google-chrome
  - guitar-pro
  - notion
  - rapidapi
  - signal
  - slack
  - sonos
  - steam
  - visual-studio-code
  - zoom

# Rust
rust_version: 1.84.1
rust_update: true
build_rust_from_source: false
rust_install_clean: true

# Cargo
cargo_items:
  - name: ripgrep
    binary: rg

# Rust Shell Configuration
shell_profiles:
  - .zshrc

# Oh My ZSH
oh_my_zsh_plugins:
  - asdf
  - git
  - zsh-autosuggestions

oh_my_zsh_install: yes
oh_my_zsh_update_mode: auto
oh_my_zsh_update_frequency: 13
